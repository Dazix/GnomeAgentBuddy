name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Syntax only: the files import gi:// modules, which only exist inside gjs/GNOME Shell.
      - name: Check JavaScript syntax
        run: git ls-files -z '*.js' | xargs -0 -n1 node --check
      - name: Lint Python
        run: pipx run ruff==0.16.10 check --isolated --select E4,E7,E9,F relay

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y gjs libglib2.0-bin
      # Compiles for real (not --dry-run): a test reads the compiled schema.
      - name: Compile and validate GSettings schema
        run: glib-compile-schemas --strict schemas/
      - name: Extension unit tests
        run: gjs -m tests/run.js
      - name: Relay unit tests
        run: python3 -m unittest discover -s relay
